# Home EMS example configuration (add to configuration.yaml, restart HA).
# Values match: 150 kWh battery, 6.4 kWp PV, ~15 kWh/day house load, NL tariffs.
# Entity ids are examples - replace them with your own.

home_ems:
  plan_days: 7            # planning horizon; a week fits a 150 kWh battery
  update_interval: 5      # minutes between re-plans (also re-plans every 15 min slot)

  battery:
    capacity_kwh: 150
    soc_entity: sensor.battery_soc          # % (or set soc_unit: kwh)
    max_charge_kw: 10                       # also adjustable at runtime (number entity)
    max_discharge_kw: 10
    charge_efficiency: 0.95
    discharge_efficiency: 0.95
    reserve_soc_pct: 10
    # hold_soc_pct: 40       # normally keep at least this much (soft, default = reserve)
    # hold_cost: 0.10        # EUR per kWh per day below the hold level
    max_soc_pct: 100
    cycle_cost: 0.01                        # EUR per kWh in/out, stops pointless micro-cycles
    # terminal_value: 0.20                  # EUR/kWh left at the end of the horizon (default: auto)

  grid:
    import_limit_kw: 17                     # 3x25A
    export_limit_kw: 10
    allow_curtail: true                     # inverter can stop exporting at negative prices

  prices:
    # Firm day-ahead prices (15 min since Oct 2025). Option A: Nord Pool core integration.
    source:
      service: nordpool.get_prices_for_date
      data:
        config_entry: 01JXXXXXXXXXXXXXXXXXXXXXXX   # Settings > Devices > Nord Pool > ... > entry id
        date: "{date}"
        areas: NL
        currency: EUR
      days: 2
      unit: eur_mwh
    # Option B: any sensor with a price list in its attributes (ENTSO-e, Nord Pool HACS, Frank...)
    # source:
    #   entity: sensor.average_electricity_price_today
    #   attributes: [prices_today, prices_tomorrow]
    #   includes_tax: false

    # Forecasts beyond the day-ahead prices, used in this order. Days not covered
    # by any forecast use the built-in weekday/time-of-day model from price history.
    forecasts: []
    #  - name: epexpredictor         # free ~7 day forecast, see README
    #    url: "https://epexpredictor.batzill.com/prices?region=NL&unit=EUR_PER_KWH&timezone=Europe/Amsterdam"
    #    unit: eur_kwh
    #    includes_tax: false
    #    refresh_minutes: 180

    vat_pct: 21
    energy_tax: 0.0916          # EUR/kWh excl. VAT - check the current year's tariff
    import_markup: 0.02         # supplier fee per kWh excl. VAT
    export_mode: raw            # "import" while net metering (salderen) still applies
    export_fee: 0.01            # subtracted from the raw price on export
    export_vat: false
    forecast_margin: 0.01       # EUR/kWh penalty on forecast (non-firm) prices

  solar:
    # Option A: re-use the Solcast HA integration (no extra API calls)
    solcast_entities:
      - sensor.solcast_pv_forecast_forecast_today
      - sensor.solcast_pv_forecast_forecast_tomorrow
      - sensor.solcast_pv_forecast_forecast_day_3
      - sensor.solcast_pv_forecast_forecast_day_4
      - sensor.solcast_pv_forecast_forecast_day_5
      - sensor.solcast_pv_forecast_forecast_day_6
      - sensor.solcast_pv_forecast_forecast_day_7
    # Option B: call the Solcast API directly
    # solcast_api_key: !secret solcast_api_key
    # solcast_sites: [abcd-1234-efgh-5678]
    # api_calls_per_day: 8      # hobbyist accounts get 10
    scale: 1.0

  load:
    energy_entity: sensor.house_consumption_energy     # kWh, total_increasing
    subtract_entities: [sensor.ev_charger_energy]      # planned separately
    history_days: 28
    default_daily_kwh: 15

  ev:
    connected_entity: binary_sensor.wallbox_car_connected
    soc_entity: sensor.car_battery_level               # optional; else use "EV energy to add"
    battery_kwh: 60
    min_kw: 4.1                                        # 3 x 6 A
    max_kw: 11
    phases: 3
    target_soc_pct: 80
    ready_by: "07:00"
    mode: smart                                        # off | solar | smart | max
    start:
      - action: number.set_value
        target: {entity_id: number.wallbox_charging_current}
        data: {value: "{{ [current_a, 6] | max | round(0) }}"}
      - action: switch.turn_on
        target: {entity_id: switch.wallbox_charging}
    stop:
      - action: switch.turn_off
        target: {entity_id: switch.wallbox_charging}

  # Inverter control. Variables available in every action:
  #   mode, power_w, power_kw, target_soc, soc, reserve_soc, curtail, until,
  #   import_price, export_price
  # Adapt to your inverter integration (Solarman/Deye, SolaX Modbus, GivTCP, ...).
  control:
    enabled: false              # start in plan-only mode; turn on with switch.home_ems_control_inverter
    reapply_minutes: 15
    charge:
      - action: select.select_option
        target: {entity_id: select.inverter_work_mode}
        data: {option: "Force charge"}
      - action: number.set_value
        target: {entity_id: number.inverter_charge_power}
        data: {value: "{{ power_w }}"}
      - action: number.set_value
        target: {entity_id: number.inverter_charge_target_soc}
        data: {value: "{{ target_soc }}"}
    export:
      - action: select.select_option
        target: {entity_id: select.inverter_work_mode}
        data: {option: "Force discharge"}
      - action: number.set_value
        target: {entity_id: number.inverter_discharge_power}
        data: {value: "{{ power_w }}"}
    hold:
      - action: select.select_option
        target: {entity_id: select.inverter_work_mode}
        data: {option: "Battery hold"}
    self_consumption:
      - action: select.select_option
        target: {entity_id: select.inverter_work_mode}
        data: {option: "Self use"}

  # Fixed manual slots (more can be added at runtime with home_ems.add_manual_slot)
  manual_slots:
    - name: Sunday cheap fill
      mode: charge
      power_kw: 10
      weekdays: sun
      start_time: "11:00"
      end_time: "15:00"

  # Known heavy loads that are not in the normal load history
  heavy_loads:
    - name: Sauna
      power_kw: 6
      duration_min: 90
      weekdays: sat
      start_time: "19:00"
